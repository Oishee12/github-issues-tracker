<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- daisyUI + tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>GitHub Issues Tracker</title>
</head>

<body>
    <!-- navbar -->
    <nav class="navbar bg-base-100 shadow-sm">
        <div class="flex flex-1 max-w-screen-xl mx-auto">
            <div class="flex flex-1 items-center gap-2">
                  <img class="h-10" src="./assets/github-logo.png" alt="github-logo">
                    <p class="font-bold text-sm lg:text-xl">GitHub Issues Tracker</p>   
            </div>

            <div class="relative flex gap-2">
                <i class="fa-brands fa-sistrix absolute top-3 z-10"></i>
                <input type="text" placeholder="Search Issues..." class="input input-bordered w-24 md:w-auto pl-5" />
                <button class="btn btn-primary">Search</button>
            </div>
        </div>
    </nav>
</body>

</html>
