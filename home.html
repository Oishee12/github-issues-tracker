<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- daisyUI + tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>GitHub Issues Tracker</title>
</head>

<body class="bg-[#F8FAFC]">
    <!-- navbar -->
    <nav class="navbar bg-base-100 shadow-sm">
        <div class="flex flex-1 max-w-screen-xl mx-auto">
            <div class="flex flex-1 items-center gap-2">
                <img class="h-10" src="./assets/github-logo.png" alt="github-logo">
                <p class="font-bold text-sm lg:text-xl">GitHub Issues Tracker</p>
            </div>

            <div class="relative flex gap-2">
                <i class="fa-brands fa-sistrix absolute top-3 z-10"></i>
                <input type="text" placeholder="Search Issues..." class="input input-bordered w-24 md:w-auto pl-5" />
                <button class="btn btn-primary">Search</button>
            </div>
        </div>
    </nav>

    <!-- three buttons section -->
    <section>
        <nav class="navbar bg-base-100 shadow-sm border border-gray-100 mt-8 lg:mt-12 max-w-screen-lg mx-auto">
            <div id="btn-container" class="flex justify-center items-center">
            </div>
        </nav>
    </section>

    <!-- 50 issues section -->
    <section>
        <div class="navbar bg-base-100 border border-gray-200 mt-4 max-w-screen-lg mx-auto flex justify-between">
            <div class="flex justify-center items-center gap-2">
                <div class="h-11 w-11 bg-[#ECE4FF] rounded-full flex justify-center items-center">
                    <img src="./assets/Aperture.png" alt="Aperture">
                </div>

                <div>
                    <h3 class="font-semibold"><span id="issue-number">0</span> Issues</h3>
                    <p class="gray lg:block hidden">Track and manage your project issues</p>
                </div>
            </div>

            <div class="flex items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-[#00A96E]"></div>
                <p class="pr-4">Open</p>

                <div class="w-3 h-3 rounded-full bg-[#A855F7]"></div>
                <p>Closed</p>
            </div>
        </div>

        <!-- all issues div -->
        <div id="all-issues" class="bg-base-100 border border-gray-200 max-w-screen-lg mx-auto p-5 grid grid-cols-1 lg:grid-cols-4 gap-4">

            
        </div>

        <!-- spinner -->
        <div class="hidden">
                <div id="loading-spinner" class=" flex justify-center my-10 ">
                    <span class="loading loading-spinner loading-lg"></span>
                </div>
            </div>
    </section>
    <!-- modal -->
     <!-- Open the modal using ID.showModal() method -->
<!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
<dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <div id="details-container">
        
    </div>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-primary">Close</button>
      </form>
    </div>
  </div>
</dialog>
    <script src="./scripts/issuesAPI.js"></script>
</body>

</html>
