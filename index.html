<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- daisyUI + tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <title>Github Issues Tracker</title>
</head>

<body class="min-h-screen max-w-md mx-auto bg-[#F8FAFC] flex justify-center items-center">
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
        <div class="card-body">
            <div class="flex justify-center items-center">
                <div>
                    <div class="flex justify-center">
                        <img src="./assets/github-logo.png" alt="github-logo">
                    </div>
                <h2 class="text-center text-2xl font-bold">GitHub Issues Tracker</h2>
                <p class="text-center gray text-base">Sign in to manage your issues</p>
                </div>
            </div>

            <fieldset class="fieldset mt-4">
                <label class="label font-semibold text-neutral text-lg">Username</label>
                <input id="username" type="text"
                    class="input bg-base-200 rounded-lg text-neutral" placeholder="Enter Username"/>
                    <p class="text-primary pb-3">Default: admin</p>

                <label class="label font-semibold text-neutral text-lg">Password</label>
                <input id="password" type="text" class="input bg-base-200 rounded-lg text-neutral"
                    placeholder="Enter Password" />
                    <p class="text-primary">Default: admin123</p>
                <button id="signIn-btn" class="btn btn-primary rounded-lg mt-4">Sign In</button>
            </fieldset>
        </div>
    </div>

    <script src="./scripts/signIn.js"></script>
</body>

</html>
